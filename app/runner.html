<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simulator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brandbar">
      <img id="logo" class="logo-small" alt="Logo" />
      <div>
        <div id="brand" class="brandname"></div>
        <div class="brandnote">Exam Simulator</div>
      </div>
    </div>

    <nav class="nav">
      <span id="timer" class="timer hidden"></span>
      <a class="navlink" href="#" id="backLink">Back</a>
    </nav>
  </header>

  <main class="container">

    <!-- RUNNER -->
    <section id="runnerPanel" class="page">
      <h2 id="title">Loading…</h2>
      <p id="desc" class="helper"></p>
      <p id="metaLine" class="helper"></p>


      <div class="panel" style="margin-top:14px;">
        <div id="progress" class="progress"></div>
<p id="itemPart" class="helper" style="margin-bottom:6px;"></p>
<p id="itemInstruction" class="helper" style="margin-bottom:14px;"></p>

<div id="stimulusPanel" class="stimulusPanel hidden">
  <div id="stimulusType" class="stimulusType"></div>
  <h3 id="stimulusTitle" class="stimulusTitle"></h3>
  <div id="stimulusText" class="stimulusText"></div>
</div>

<div id="prompt" class="prompt"></div>

        <div id="choices" class="choices"></div>

        <div class="row" style="margin-top:14px;">
          <button id="prevBtn" class="btn btn-secondary">Previous</button>
          <button id="nextBtn" class="btn btn-secondary">Next</button>
          <button id="finishBtn" class="btn">Finish</button>
        </div>
      </div>
    </section>

    <!-- FULL-LENGTH SECTION TRANSITION -->
    <section id="transitionPanel" class="page hidden">
      <h2 id="transitionTitle">Section Complete</h2>
      <p id="transitionDesc" class="helper"></p>

      <div class="panel" style="margin-top:14px;">
        <p class="helper">
          Review is available only after the complete Full-Length exam.
        </p>
        <button id="transitionBtn" class="btn" style="margin-top:12px;">
          Start Next Section
        </button>
      </div>
    </section>

<!-- ESSAY -->
<section id="essayPanel" class="page hidden">
  <h2 id="essayTitle">Writing — Loading…</h2>
  <p id="essayDesc" class="helper"></p>
  <p id="essayMeta" class="helper"></p>

  <div class="panel" style="margin-top:14px;">
    <div id="essayPrompt" class="prompt"></div>

    <label class="label" for="essayText" style="margin-top:12px;">Your Response</label>
    <textarea id="essayText" class="essayBox" placeholder="Start writing here..."></textarea>

    <div class="essayFooter">
      <div class="helper"><span id="wordCount">0</span> words</div>
      <div class="row">
        <button id="essaySaveBtn" class="btn btn-secondary">Save</button>
        <button id="essayFinishBtn" class="btn">Finish</button>
      </div>
    </div>
  </div>
</section>

<!-- ESSAY RESULTS -->
<section id="essayResultsPanel" class="page hidden">
  <h2>Writing Results</h2>
  <p id="essayTimeLine" class="helper"></p>
  <p id="essayWordLine" class="helper"></p>

  <div class="panel" style="margin-top:14px;">
    <h3 style="margin:0 0 10px;">Essay Self-Review</h3>
    <p class="helper">
      This essay is not auto-scored. Review your response using the guidance and rubric below.
    </p>

    <div id="essayModelGuidance" class="reviewExp" style="margin-top:12px;"></div>
    <div id="essayRubric" class="reviewExp" style="margin-top:12px;"></div>

    <button id="essayHomeBtn" class="btn" style="margin-top:12px;">Back to Home</button>
  </div>
</section>
    <!-- RESULTS -->
    <section id="resultsPanel" class="page hidden">
      <h2>Results</h2>
      <p id="scoreLine" class="helper"></p>
      <p id="timeLine" class="helper"></p>

      <div id="sectionResults" class="panel hidden" style="margin-top:14px;"></div>

      <div id="review" class="review"></div>

      <button id="homeBtn" class="btn" style="margin-top:14px;">Back to Home</button>
    </section>

  </main>

  <script src="common.js?v=3"></script>
  <script src="full-length.js?v=1"></script>
  <script src="runner.js?v=10"></script>
</body>
</html>
